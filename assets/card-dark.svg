    <text x="40" y="284" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b8175" letter-spacing=".14em">ROLE</text>
    <text x="150" y="284" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f3f0e8">operator · human peer</text>
