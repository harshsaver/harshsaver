name: operation.profile

# The profile maintains itself. Apollo and Atlas propose; the operator adjudicates
# by replying to the issue this workflow opens. See AGENTS.md for the rules.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [bus-event] # the October Bus can poke this directly
  push:
    paths:
      - 'state.json'
      - 'scripts/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: operation-profile
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh the ship log from real activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: harshsaver
        run: node scripts/shiplog.mjs

      # Optional. Without these secrets the profile still renders and the ship log
      # still updates — you just lose the adjudication loop, which is the whole point.
      - name: Apollo drafts, Atlas reviews
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code -p \
            "Read AGENTS.md and follow it as Apollo. Inspect the diff to README.md from
             the previous step, update state.json's trace and message to reflect what
             actually happened, and stop. Do not edit README.md outside the SHIPLOG
             markers. Do not invent numbers." \
            --allowedTools "Read,Edit,Bash(git diff:*),Bash(git log:*)"

      - name: Render the artwork
        run: node scripts/render.mjs

      - name: Commit if anything moved
        run: |
          git config user.name  'apollo[bot]'
          git config user.email 'apollo@users.noreply.github.com'
          if git diff --quiet; then
            echo "nothing changed; the operation is current"
            exit 0
          fi
          git add -A
          git commit -m "operation: refresh trace, ledger, and ship log"
          git push
